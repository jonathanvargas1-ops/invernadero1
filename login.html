<!DOCTYPE html>
<html lang="es">

    <head>

<meta charset="UTF-8">
        <title>pagina login </title>

        <link rel="stylesheet" href="login.css">
        <link rel="manifest" href="manifest.json">

        <meta name="viewport" content="width=device-width, initial-scale=1">
        
    </head>

    <body>

       <p class="aviso-sin-conexion" x-data="conexion" x-show="sin_conexion()">
        Estás sin conexión!!
           </p>



       <main> 
        <section> 
   <div class="cuadroizquierdo"> 

     <header>
            <h1>Mi invernadero</h1>
        </header>

    <div class=" tarjeta" x-data="login">

      <h1> Bienvenido  </h1>
      <p>iniciar sesion para continuar</p>
   
       <form @submit.prevent="ingresar()"> 

     <label for="correo">Correo:</label>
     <input 
     id= "correo" 
     type= "email"
     name= "correo"
     placeholder= "Ingresa tu correo electronico"
     required x-model="correo">

     <label for="contraseña">Contraseña:</label>
     <input
     id="contraseña"
     type="password"
     name="contraseña"
     placeholder= "Ingresa tu contraseña"
     required x-model="clave">
    <p x-show="showLoading">Ingresando...</p>
    <p x-show="showError" x-text="showError"></p>

         <button type="submit">Iniciar sesión</button>

      <nav class="acceso-admin">
          <p>¿Eres administrador? <a href="admin_usuarios.html">Ingresa aquí</a></p>
      </nav>

       </form>
       </div>

       <footer>
        <p>&copy; Mi invernadero. Desarrollo Web</p>
    </footer>


      </div>

      <div class="cuadroderecho">
        <img src="imagenes/login22.png" alt="">

    </div>

</section>

        </main>
<!-- repo -->

<script src="js/servicios/LecturaService.js"></script>
