<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultivos</title>
    <link rel="stylesheet" href="cultivos.css">
</head>
<header>
    <nav>
        <ul>
            <li><a href="invernadero.html">Invernadero</a></li>
            <li><a href="cultivos.html">Cultivos</a></li>
        </ul>
</header>
<main>
    <section>
        <div class= "cuadroizquierdo">
            <h1>Mis cultivos</h1>
            <p> Cultivos disponibles en el invernadero</p>
            <table>
                <tr>
                   <th>Cultivo</th>
                   <th>Tipo</th>
                 <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="lista-cultivos">
                        <tr>
                            <td>Tomate </td>
                            <td>Hortaliza</td>
                            <td>En crecimiento</td>
                        </tr>
                        <tr>
                            <td>Papa</td>
                            <td>Tuberculo</td>
                            <td>Listo para cosecha</td>
                        </tr>
                    </tbody>
                </table>
              </tr>
            </table>
        </div>
        <div class="cuadroderecho">
            <div>
            <h2>¿Agregar cultivo?</h2>
            <p>Ingresar información del nuevo cultivo:</p>
            <form id="form-cultivo">
                <label for="nombre">Nombre del cultivo:</label>
                <input type="text" id="nombre" name="nombre" required>

                <label for="tipo">Tipo de cultivo:</label>
                <input type="text" id="tipo" name="tipo" required>

                <label for="estado">Estado del cultivo:</label>
                <input type="text" id="estado" name="estado" required>

                <button type="submit">Agregar Cultivo</button>
            </form>
             </div>
             </div>
    </section>
</main>
<footer>
    <p>&copy; Mi invernadero Desarrollo Web</p>
</footer>
</body>
</html>
