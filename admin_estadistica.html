<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas Globales</title>
    <link rel="stylesheet" href="admin_estadistica.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <header>
        <h1>Panel de Administración</h1>
        <nav>
            <ul>
                <li><a href="admin_usuarios.html">Gestión de Usuarios</a></li>
                <li><a href="login.html">Cerrar Sesión</a></li>
            </ul>
        </nav>
    </header>
    
    <main x-data="adminEstadistica">
        <section>
            <h2>Resumen del Sistema</h2>

            <div x-show="showLoading">
                <p>Calculando estadísticas...</p>
            </div>

            <div x-show="showError" style="color: red;">
                <p x-text="showError"></p>
            </div>

            <div x-show="mostrar_estadisticas()">
                <article>
                    <h3>Usuarios Totales</h3>
                    <p x-text="estadisticas.totalUsuarios"></p>
                </article>
                <article>
                    <h3>Invernaderos Activos</h3>
                    <p x-text="estadisticas.totalCultivos"></p>
                </article>
                <article>
                    <h3>Sensores Registrados</h3>
                    <p x-text="estadisticas.totalSensores"></p>
                </article>
            </div>

            <section>
                <div></div>
                <div></div>
            </section>

        </section>
    </main>

    <footer>
        <p>&copy; Mi invernadero. Desarrollo Web</p>
    </footer>

    <script src="js/repositorios/UsuarioRepository.js"></script>
    <script src="js/repositorios/LocalStorageUsuarioRepository.js"></script>
    <script src="js/servicios/UsuarioService.js"></script>
    <script src="js/servicios/EstadisticaService.js"></script>
    <script src="js/controladores/SensorController.js"></script>
    <script src="js/controladores/FilaSensorController.js"></script>
    <script src="js/controladores/adminEstadisticaController.js"></script>
    <script src="js/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js');
        });
      }
    </script>
</body>
</html>
